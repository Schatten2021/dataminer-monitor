[workspace]
members = ["status-server-core"]
resolver = "3"

[workspace.dependencies]
tracing = "0.1"
axum = "0.8"
tokio = "1"
thiserror = "2"

[package]
name = "status-server"
version = "2.0.0"
edition = "2024"
publish = ["kellnr"]

[dependencies]
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["parking_lot", "tracing-log"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }