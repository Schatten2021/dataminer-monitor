[workspace]
members = ["api-types","default-components", "frontend","server"]
resolver = "3"

[workspace.dependencies]
tracing = "0.1"
axum = "0.8"
tokio = { version = "1.53", features = ["signal"] }
serde = "1"
utils = { version = "0.4", registry = "kellnr", features = ["never"] }
parking_lot = "0.12"
chrono = "0.4"
toml = "1.1"
server = { path = "server" }
async-trait = "0.1"
default-components = { path = "default-components" }
api-types = { path = "api-types" }

[package]
name = "status-server"
version = "3.0.0-beta.5"
edition = "2024"
publish = ["kellnr"]

[dependencies]
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["parking_lot", "tracing-log"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
server.workspace = true
axum.workspace = true
default-components.workspace = true
clap = { version = "4.6", features = ["derive"] }
